name: Personal Repository CI/CD Pipeline (BlueHeart-Saga)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  personal-backend-ci:
    name: Personal Backend CI & Tests
    if: github.repository == 'BlueHeart-Saga/NHSS-ALUMNI'
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Tests
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: school_alumni_db_test
          JWT_SECRET: test-super-secret-key-32-chars-minimum-length
        run: |
          cd backend
          pytest -v

  personal-frontend-ci:
    name: Personal Frontend CI & Build
    if: github.repository == 'BlueHeart-Saga/NHSS-ALUMNI'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'admin-web/package-lock.json'

      - name: Install & Build Admin Web
        run: |
          cd admin-web
          npm ci
          npm run build

  personal-mobile-ci:
    name: Personal Mobile App CI & Build
    if: github.repository == 'BlueHeart-Saga/NHSS-ALUMNI'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile-app/package-lock.json'

      - name: Install & Build Mobile App
        run: |
          cd mobile-app
          npm ci
          npm run build
