name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend CI & Tests (Python/FastAPI)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Unit & Integration Tests
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: school_alumni_db_test
          JWT_SECRET: test-super-secret-key-32-chars-minimum-length
        run: |
          cd backend
          pytest -v

  frontend-ci:
    name: Frontend CI & Build (Admin Web React/Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'admin-web/package-lock.json'

      - name: Install Admin Web Dependencies
        run: |
          cd admin-web
          npm ci

      - name: Build Admin Web Production Bundle
        env:
          VITE_API_BASE_URL: "http://localhost:8000/api/v1"
          VITE_APP_NAME: "NHSS Alumni Platform"
        run: |
          cd admin-web
          npm run build

  mobile-app-ci:
    name: Mobile App CI & Build (React/Vite Mobile)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile-app/package-lock.json'

      - name: Install Mobile App Dependencies
        run: |
          cd mobile-app
          npm ci

      - name: Build Mobile App Bundle
        run: |
          cd mobile-app
          npm run build

  cd-deployment:
    name: Continuous Deployment Trigger
    needs: [backend-ci, frontend-ci, mobile-app-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deployment Success Notification
        run: |
          echo "All CI pipeline tests and production builds passed successfully on main branch!"
          echo "Automated Deployment Ready."
