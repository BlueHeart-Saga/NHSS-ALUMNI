# Rerun trigger: 2026-08-29 11:00 AM
name: Company Frontend Azure Deployment (NHSS-ALUMNI)

on:
  push:
    branches:
      - main
    paths:
      - 'admin-web/**'
      - 'package.json'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy-frontend:
    name: Deploy Admin Web to Azure (NHSS-ALUMNI)
    if: github.repository == 'Devopstrio/NHSS-ALUMNI'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Frontend .env from GitHub Secrets
        run: |
          cat << 'EOF' > admin-web/.env
          VITE_APP_NAME="${{ secrets.VITE_APP_NAME }}"
          VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL }}"
          VITE_BACKEND_URL="${{ secrets.VITE_BACKEND_URL }}"
          VITE_GOOGLE_CLIENT_ID="${{ secrets.VITE_GOOGLE_CLIENT_ID }}"
          EOF

      - name: Install dependencies & Build Admin Web
        run: |
          npm install
          npm run build

      - name: Deploy to Azure Web App (NHSS-ALUMNI)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'NHSS-ALUMNI'
          slot-name: 'Production'
          package: '.'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND || secrets.AZUREAPPSERVICE_PUBLISHPROFILE_1FB60DDBFE624590A62E15E2E558AA7F }}
