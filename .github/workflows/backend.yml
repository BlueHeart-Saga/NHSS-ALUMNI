# Production deployment trigger: 2026-08-29 12:08 PM
name: Company Backend Azure Deployment (NHSS-ALUMNI-BACKEND)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy-backend:
    name: Build & Deploy FastAPI Backend to Azure (NHSS-ALUMNI-BACKEND)
    if: github.repository == 'Devopstrio/NHSS-ALUMNI'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies into Azure virtual environment (antenv) & set permissions
        run: |
          cd backend
          chmod +x startup.sh
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy Direct to Azure Web App (NHSS-ALUMNI-BACKEND)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'NHSS-ALUMNI-BACKEND'
          slot-name: 'Production'
          package: './backend'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND || secrets.AZUREAPPSERVICE_PUBLISHPROFILE_F9ABA5BFE5AF4C56B5A5E9DCC96455D3 }}
